name: Deploy Typeduo

on:
  push:
    branches:
      - deploy/develop
  workflow_dispatch:

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/typeduo-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/typeduo-backend:latest
          cache-to: type=inline

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/typeduo-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/typeduo-frontend:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 115.73.218.193 >> ~/.ssh/known_hosts

      - name: Copy docker-compose to server
        run: |
          scp docker-compose.yml vutri@115.73.218.193:~/projects/typeduo/

      - name: Connect and deploy
        run: |
          ssh vutri@115.73.218.193 << 'EOF'
            set -e
            cd ~/projects/typeduo

            export DOCKERHUB_USER=${{ secrets.DOCKERHUB_USERNAME }}

            echo "${{ secrets.SSH_PASS }}" | sudo -E -S docker compose pull
            echo "${{ secrets.SSH_PASS }}" | sudo -E -S docker compose up -d
          EOF
